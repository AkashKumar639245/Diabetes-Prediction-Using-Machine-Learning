
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #eef5f7;
            color: #243447;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #087f8c;
            margin-bottom: 10px;
        }

        .header p {
            color: #718096;
            font-size: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            padding: 12px;
            border: 1px solid #d4e0e5;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            width: 100%;
        }

        input:focus {
            border-color: #087f8c;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 28px;
            border: none;
            border-radius: 8px;
            background: #087f8c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #066570;
        }

        .output {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            background: #edf8f8;
            border-left: 5px solid #087f8c;
        }

        .output h2 {
            margin-top: 0;
            color: #087f8c;
            font-size: 20px;
        }

        .output p {
            margin-bottom: 0;
            line-height: 1.6;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #718096;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Diabetes Prediction</h1>
            <p>Enter the health measurements below to get a model prediction.</p>
        </div>

        <form action="/predict" method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label for="num_preg">Number of Pregnancies</label>
                    <input type="text" id="num_preg"
                           name="num_preg" min="0" required>
                </div>

                <div class="form-group">
                    <label for="glucose_conc">Glucose Concentration</label>
                    <input type="text" id="glucose_conc"
                           name="glucose_conc" min="0" required>
                </div>

                <div class="form-group">
                    <label for="diastolic_bp">Diastolic Blood Pressure</label>
                    <input type="text" id="diastolic_bp"
                           name="diastolic_bp" min="0" required>
                </div>

                <div class="form-group">
                    <label for="insulin">Insulin</label>
                    <input type="text" id="insulin"
                           name="insulin" min="0" required>
                </div>

                <div class="form-group">
                    <label for="bmi">BMI</label>
                    <input type="text" step="any" id="bmi"
                           name="bmi" min="0" required>
                </div>

                <div class="form-group">
                    <label for="diab_pred">Diabetes Pedigree Function</label>
                    <input type="text" step="any" id="diab_pred"
                           name="diab_pred" min="0" required>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="text" id="age"
                           name="age" min="1" required>
                </div>

                <div class="form-group">
                    <label for="skin">Skin Thickness</label>
                    <input type="text" id="skin"
                           name="skin" min="0" required>
                </div>

            </div>

            <button type="submit">Predict Diabetes</button>

        </form>

        <div class="output">
            <h2>Prediction Output</h2>
            <p>{{ prediction_text or "Your prediction will appear here after submitting the form." }}</p>
        </div>

        <div class="footer">
            Machine Learning Project | Diabetes Prediction
        </div>

    </div>

</body>
</html>
